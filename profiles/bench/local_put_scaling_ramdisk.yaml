name: local-put-scaling-ramdisk
gcp:
  project: CHANGEME_LOCAL_ONLY_PROFILE_DO_NOT_RUN
  region: us-central1
  operator_cidrs:
    - 0.0.0.0/0
  ssh_user: ubuntu
  coordinator_machine_type: c4a-standard-8
  client_machine_type: c4a-standard-16
  storage_machine_type: c4a-standard-48-lssd
  coordinator_boot_disk_gib: 100
local:
  storage_layout: ramdisk
  ramdisk_size_mib: 8192
storage:
  journal_shards: 16
  journal_batch_delay_low: 50us
  journal_batch_delay_high: 250us
  journal_batch_depth_threshold: 8
  journal_batch_max_ops: 64
cluster:
  slot_count: 1024
  replication_factor: 3
  storage_node_count: 3
  heartbeat_interval: 1s
  liveness_interval: 1s
  suspect_after: 3s
  dead_after: 6s
  activation_interval: 250ms
  rpc_deadline: 5s
  reconfiguration:
    max_changed_chains: 32
workload:
  seed: 42
  preload_keys: 10000
  value_bytes: 256
  request_timeout: 3s
  per_scenario_pause: 1s
  interval: 1s
  scenarios:
    - name: put-only-c32
      kind: put
      concurrency: 32
      warmup: 5s
      duration: 10s
      value_bytes: 256
    - name: put-only-c64
      kind: put
      concurrency: 64
      warmup: 5s
      duration: 10s
      value_bytes: 256
    - name: put-only-c128
      kind: put
      concurrency: 128
      warmup: 5s
      duration: 10s
      value_bytes: 256
    - name: put-only-c256
      kind: put
      concurrency: 256
      warmup: 5s
      duration: 10s
      value_bytes: 256
    - name: mixed-80-20-c64
      kind: mixed
      concurrency: 64
      warmup: 5s
      duration: 10s
      read_percent: 80
      value_bytes: 256
    - name: mixed-80-20-c128
      kind: mixed
      concurrency: 128
      warmup: 5s
      duration: 10s
      read_percent: 80
      value_bytes: 256
telemetry:
  probe_interval: 1s
  command_interval: 1s
  extra_run_duration: 10s
  pprof_cpu_duration: 0s
artifacts:
  root_dir: artifacts/benchmarks
